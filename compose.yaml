# Local development only. Not a production deployment description (production targets Azure; see infra/).
# Values come from .env (see .env.example). On Windows, .\start-local.ps1 creates .env with a random
# database password. See docs/LOCAL_SETUP.md.
name: govbid-pro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govbidpro
      POSTGRES_USER: govbid
      # Local-only development credential. Never reuse outside your machine.
      POSTGRES_PASSWORD: ${GOVBID_LOCAL_DB_PASSWORD:-govbid_local_dev}
    ports:
      - "127.0.0.1:${GOVBID_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govbid -d govbidpro"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      args:
        NODE_IMAGE: ${GOVBID_NODE_IMAGE:-node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GovBidPro: Host=db;Port=5432;Database=govbidpro;Username=govbid;Password=${GOVBID_LOCAL_DB_PASSWORD:-govbid_local_dev}
      Storage__LocalRootPath: /data/storage
      # Live SAM.gov opportunities (optional). Set GOVBID_SAMGOV_ENABLED=true and GOVBID_SAMGOV_API_KEY in
      # .env (never committed). The same switch turns on the scheduled sync, which runs once at startup and
      # then every GOVBID_SAMGOV_SYNC_MINUTES. GOVBID_DEMO_FIXTURES=false stops importing the demo notices.
      OpportunitySources__SamGov__Enabled: ${GOVBID_SAMGOV_ENABLED:-false}
      OpportunitySources__SamGov__ApiKey: ${GOVBID_SAMGOV_API_KEY:-}
      OpportunitySources__SamGov__LookbackDays: ${GOVBID_SAMGOV_LOOKBACK_DAYS:-2}
      OpportunitySources__Sync__Enabled: ${GOVBID_SAMGOV_ENABLED:-false}
      OpportunitySources__Sync__IntervalMinutes: ${GOVBID_SAMGOV_SYNC_MINUTES:-360}
      OpportunitySources__Fixture__ImportOnStartup: ${GOVBID_DEMO_FIXTURES:-true}
      # Email (optional). Default Log writes emails to the container log instead of sending them. Set
      # GOVBID_EMAIL_PROVIDER=Smtp plus the GOVBID_SMTP_* values in .env (never committed) to really send,
      # for example through SendGrid. Links in emails point at this machine (localhost), so they only open here.
      Email__Provider: ${GOVBID_EMAIL_PROVIDER:-Log}
      Email__FromAddress: ${GOVBID_EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${GOVBID_EMAIL_FROM_NAME:-GovBid Pro}
      Email__Smtp__Host: ${GOVBID_SMTP_HOST:-}
      Email__Smtp__Port: ${GOVBID_SMTP_PORT:-587}
      Email__Smtp__Username: ${GOVBID_SMTP_USERNAME:-}
      Email__Smtp__Password: ${GOVBID_SMTP_PASSWORD:-}
      Collaboration__PublicBaseUrl: http://localhost:${GOVBID_WEB_PORT:-8080}
    ports:
      - "127.0.0.1:${GOVBID_WEB_PORT:-8080}:8080"
    volumes:
      - storage-data:/data/storage

  # Optional malware scanner: `docker compose --profile scan up`. Then set for the web service:
  #   Documents__MalwareScanMode=ClamAv and Documents__ClamAv__Host=clamav
  # The first start downloads virus signatures and can take a few minutes. Not exposed to the host.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  clamav-data:
  db-data:
  storage-data:
